// Shared build conventions for Slimefun5 fork addons, so every addon's build.gradle.kts stops repeating
// the same version/publish/java/repository/dependency/task boilerplate.
//
// Apply AFTER the plugins { } block (which must apply: java, com.gradleup.shadow, io.github.intisy.github-gradle):
//   apply(from = "https://raw.githubusercontent.com/intisy/gradle-snippets/actions/slimefun-addon.gradle")
//
// The addon build only needs to set `group`/`description` and add any shadow relocations afterwards.
// Optional overrides via -P properties: sfCoreVersion, sfSpigotApi, sfDefaultVersion.

def sfCoreVersion    = project.findProperty('sfCoreVersion')    ?: 'gh-v5.2.4.6'
def sfSpigotApi      = project.findProperty('sfSpigotApi')      ?: '1.16.5-R0.1-SNAPSHOT'
def sfDefaultVersion = project.findProperty('sfDefaultVersion') ?: '1.0.0'

// Version: an explicit -Partifact_version wins; otherwise the latest git tag (gh-/v- prefixes stripped);
// otherwise the default. A suffix marks non-release builds.
def latestGitTagVersion = {
    try {
        def out = providers.exec {
            workingDir = rootDir
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            ignoreExitValue = true
        }
        if (out.result.get().exitValue != 0) return null
        def tag = out.standardOutput.asText.get().trim().replaceFirst(/^gh-/, '').replaceFirst(/^v/, '')
        return tag.isEmpty() ? null : tag
    } catch (Exception ignored) {
        return null
    }
}

def artifact = project.findProperty('artifact_version')?.toString()?.replaceFirst(/^v/, '')
version = (artifact != null && !artifact.isEmpty()) ? artifact : (latestGitTagVersion() ?: sfDefaultVersion)

def versionSuffix
if (artifact != null && !artifact.isEmpty()) {
    versionSuffix = ''
} else if (System.getenv('GITHUB_ACTIONS') == 'true') {
    versionSuffix = '-EXPERIMENTAL'
} else {
    versionSuffix = '-UNOFFICIAL'
}

def displayVersion = "${version}${versionSuffix}"
ext.displayVersion = displayVersion

github {
    accessToken = System.getenv('GITHUB_TOKEN') ?: ''
    publish {
        tag = System.getenv('GITHUB_REF_NAME')
    }
}

// Spigot 1.16.5 is the Java-8-compatible API baseline; version-specific behaviour goes through Slimefun's
// compat layer so the single jar still runs on 1.8 - 26.x.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.codemc.io/repository/maven-public/' }
}

dependencies {
    compileOnly "org.spigotmc:spigot-api:${sfSpigotApi}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    githubCompileOnly "Slimefun5:Slimefun5:${sfCoreVersion}"
}

tasks.named('compileJava') {
    options.encoding = 'UTF-8'
}
tasks.named('processResources') {
    filesMatching('plugin.yml') {
        expand('version': displayVersion)
    }
}
tasks.named('jar') {
    enabled = false
}
tasks.named('shadowJar') {
    archiveFileName = "${project.name}-${displayVersion}.jar"
    exclude 'META-INF/**'
}
tasks.named('build') {
    dependsOn 'shadowJar'
}
